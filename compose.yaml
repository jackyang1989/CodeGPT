name: codegpt

services:
  codegpt:
    image: ${CODEGPT_SERVER_IMAGE:-ghcr.io/yyjeqhc/codegpt-server:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      CODEGPT_TOKEN: ${CODEGPT_TOKEN:?set CODEGPT_TOKEN in .env}
      CODEGPT_ADDR: 0.0.0.0:8080
      CODEGPT_DATA: /var/lib/codegpt
      CODEGPT_PUBLIC_URL: ${CODEGPT_PUBLIC_URL:?set CODEGPT_PUBLIC_URL in .env}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # Only the existing reverse proxy on this host should reach CodeGPT.
      - "${CODEGPT_HOST_IP:-127.0.0.1}:${CODEGPT_HOST_PORT:-8080}:8080"
    volumes:
      - codegpt_data:/var/lib/codegpt
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/openapi.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  codegpt_data:
