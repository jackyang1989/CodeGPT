version = 1

[layers]
leaf = 0
domain = 1
runtime = 2
application = 3
composition = 4
entrypoint = 5

[root_test_support]
feature = "root-test-support"
providers = [
    "codegpt-runner-registry",
    "codegpt-store",
    "codegpt-tool-contracts",
    "codegpt-workflow-session",
]

[forbidden_external_dependencies]
codegpt-cli = ["quinn", "rusqlite", "salvo"]
codegpt-core = ["quinn", "rusqlite", "salvo"]
codegpt-runner = ["rusqlite", "salvo"]

[packages.codegpt]
layer = "composition"
role = "Server composition and protocol adapters."
normal = [
    "codegpt-admin",
    "codegpt-code-mode",
    "codegpt-core",
    "codegpt-persistent-shell",
    "codegpt-runner-config",
    "codegpt-runner-registry",
    "codegpt-store",
    "codegpt-tool-contracts",
    "codegpt-tool-runtime-contracts",
    "codegpt-validation",
    "codegpt-workflow-session",
    "codegpt-workspace",
]
dev = [
    "codegpt-runner-registry",
    "codegpt-store",
    "codegpt-tool-contracts",
    "codegpt-workflow-session",
]
build = []
test_support = [
    "codegpt-runner-registry",
    "codegpt-store",
    "codegpt-tool-contracts",
    "codegpt-workflow-session",
]

[packages.codegpt-admin]
layer = "leaf"
role = "Standalone operator/admin HTTP client support."
normal = []
dev = []
build = []
test_support = []

[packages.codegpt-cli]
layer = "entrypoint"
role = "User-facing CLI entrypoint over server composition and shared setup helpers."
normal = [
    "codegpt",
    "codegpt-admin",
    "codegpt-core",
    "codegpt-runner-config",
]
dev = []
build = []
test_support = []

[packages.codegpt-code-mode]
layer = "runtime"
role = "Experimental transport-neutral Code Mode frontend/runtime and bounded V8 orchestration."
normal = []
dev = []
build = []
test_support = []

[packages.codegpt-computer]
layer = "leaf"
role = "Platform-native computer-use primitives."
normal = ["codegpt-core"]
dev = []
build = []
test_support = []

[packages.codegpt-core]
layer = "leaf"
role = "Shared contracts and low-level helpers with no workspace dependencies."
normal = []
dev = []
build = []
test_support = []

[packages.codegpt-lsp]
layer = "domain"
role = "Native bounded Language Server Protocol lifecycle and semantic navigation."
normal = [
    "codegpt-core",
    "codegpt-process",
    "codegpt-runner-config",
]
dev = []
build = []
test_support = []

[packages.codegpt-persistent-shell]
layer = "domain"
role = "Persistent local shell lifecycle built on process primitives."
normal = ["codegpt-process"]
dev = []
build = []
test_support = []

[packages.codegpt-process]
layer = "leaf"
role = "OS process-tree ownership and lifecycle primitives."
normal = []
dev = []
build = []
test_support = []

[packages.codegpt-runner]
layer = "runtime"
role = "Runner executable/runtime composition for local project execution."
normal = [
    "codegpt-computer",
    "codegpt-core",
    "codegpt-lsp",
    "codegpt-persistent-shell",
    "codegpt-process",
    "codegpt-runner-config",
    "codegpt-workspace",
]
dev = []
build = []
test_support = []

[packages.codegpt-runner-config]
layer = "domain"
role = "Runner configuration contracts and parsing."
normal = ["codegpt-core"]
dev = []
build = []
test_support = []

[packages.codegpt-runner-registry]
layer = "domain"
role = "Server-side Runner registry, connection lease, queue, and reconciliation domain."
normal = ["codegpt-core"]
dev = []
build = []
test_support = []

[packages.codegpt-store]
layer = "domain"
role = "Durable SQLite-backed persistence ownership."
normal = ["codegpt-core"]
dev = []
build = []
test_support = []

[packages.codegpt-tool-contracts]
layer = "domain"
role = "Protocol-neutral tool schemas and parsing contracts."
normal = ["codegpt-core"]
dev = []
build = []
test_support = []

[packages.codegpt-tool-runtime-contracts]
layer = "runtime"
role = "Tool runtime result, recorder metadata, and audit contracts."
normal = [
    "codegpt-core",
    "codegpt-tool-contracts",
    "codegpt-workflow-session",
]
dev = []
build = []
test_support = []

[packages.codegpt-validation]
layer = "domain"
role = "Validation recipes, adapters, and evidence domain."
normal = [
    "codegpt-core",
    "codegpt-tool-contracts",
    "codegpt-workflow-session",
]
dev = [
    "codegpt-tool-contracts",
    "codegpt-tool-runtime-contracts",
    "codegpt-workflow-session",
]
build = []
test_support = [
    "codegpt-tool-contracts",
    "codegpt-workflow-session",
]

[packages.codegpt-workflow-session]
layer = "domain"
role = "Workflow Session continuity, evidence, and handoff domain."
normal = ["codegpt-core", "codegpt-tool-contracts"]
dev = []
build = []
test_support = []

[packages.codegpt-workspace]
layer = "domain"
role = "Registered project/workspace path and metadata contracts."
normal = ["codegpt-core"]
dev = []
build = []
test_support = []
