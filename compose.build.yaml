services:
  codegpt:
    # Explicit developer/source-build override. The default compose.yaml consumes
    # the published GHCR image instead of compiling Rust on the deployment host.
    image: codegpt-server-local:${CODEGPT_IMAGE_TAG:-latest}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODEGPT_GIT_COMMIT: ${CODEGPT_GIT_COMMIT:-}
        CODEGPT_GIT_DIRTY: ${CODEGPT_GIT_DIRTY:-}
        CODEGPT_BUILT_AT: ${CODEGPT_BUILT_AT:-}
