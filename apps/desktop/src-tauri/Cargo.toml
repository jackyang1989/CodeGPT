[package]
name = "codegpt-desktop"
version = "0.4.1"
description = "CodeGPT Desktop runtime and setup control surface"
edition = "2021"
publish = false

# Keep Tauri/WebView dependencies out of the root CodeGPT Cargo workspace.
[workspace]

[[bin]]
name = "CodeGPT"
path = "src/main.rs"

[lib]
name = "codegpt_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
codegpt-process = { path = "../../../crates/codegpt-process" }
codegpt-runner-config = { path = "../../../crates/codegpt-runner-config" }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
winreg = "0.55"

