[package]
name = "codegpt-validation"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
codegpt-core = { path = "../codegpt-core" }
codegpt-tool-contracts = { path = "../codegpt-tool-contracts" }
codegpt-workflow-session = { path = "../codegpt-workflow-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
codegpt-tool-contracts = { path = "../codegpt-tool-contracts", features = ["root-test-support"] }
codegpt-tool-runtime-contracts = { path = "../codegpt-tool-runtime-contracts" }
codegpt-workflow-session = { path = "../codegpt-workflow-session", features = ["root-test-support"] }
